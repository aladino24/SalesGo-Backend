name: Deploy SalesGo API

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: salesgo-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload application files
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='storage/' \
            -e "ssh -i ~/.ssh/id_ed25519 -p $VPS_PORT" \
            ./ "$VPS_USER@$VPS_HOST:/var/www/salesgo-api/"

      - name: Run Laravel deployment steps
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" <<'REMOTE'
            set -euo pipefail
            sudo mkdir -p /var/www/salesgo-api/storage /var/www/salesgo-api/bootstrap/cache
            sudo chown -R www-data:www-data /var/www/salesgo-api
            cd /var/www/salesgo-api

            if [ ! -f .env ]; then
              cp .env.example .env
            fi

            php artisan key:generate --force || true
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
            php artisan storage:link || true
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            sudo chown -R www-data:www-data storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache
            sudo supervisorctl reread || true
            sudo supervisorctl update || true
            sudo supervisorctl restart salesgo-api-worker:* || true
            sudo systemctl reload php8.4-fpm
            sudo systemctl reload nginx
          REMOTE

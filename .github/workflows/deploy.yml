name: Deploy SalesGo API

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: salesgo-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload application files
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='vendor/' \
            --exclude='storage/app/private/' \
            --exclude='storage/logs/' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/salesgo-api/"

      - name: Run Laravel deployment steps
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'REMOTE'
            set -euo pipefail
            cd /var/www/salesgo-api
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            sudo chown -R www-data:www-data storage bootstrap/cache
            sudo supervisorctl restart salesgo-api-worker:*
            sudo systemctl reload php8.4-fpm
            sudo systemctl reload nginx
          REMOTE
